<!doctype html>
<html lang="fr">
  <head>
    <!-- Google tag (gtag.js) only un public and production website -->
    <script>
      (() => {
        const isPublicProduction =
          window.location.protocol === 'https:' &&
          ['b-side-radio.com', 'www.b-side-radio.com'].includes(window.location.hostname) &&
          !/^\/(?:admin|dev)(?:\/|$)/i.test(window.location.pathname);

        if (!isPublicProduction) return;

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', 'G-3SNWYSPZ5Z');

        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-3SNWYSPZ5Z';
        document.head.appendChild(script);
      })();
    </script>
    <script type="module">
      const clarityProjectId = import.meta.env.VITE_CLARITY_PROJECT_ID_SITE?.trim();

      if (clarityProjectId && !clarityProjectId.startsWith("METTRE_ICI")) {
        (function (c, l, a, r, i, t, y) {
          c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
          t = l.createElement(r);
          t.async = 1;
          t.src = "https://www.clarity.ms/tag/" + i;
          y = l.getElementsByTagName(r)[0];
          y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", clarityProjectId);

        const trackClarityEvent = (label) => {
          if (typeof window.clarity === "function") window.clarity("event", label);
        };

        window.addEventListener("bside-clarity-event", (event) => {
          if (typeof event.detail === "string" && event.detail) trackClarityEvent(event.detail);
        });

        document.addEventListener("click", (event) => {
          const target = event.target;
          if (!(target instanceof Element)) return;
          const element = target.closest("[data-clarity-label]");
          if (!element || element.matches("input, textarea, select")) return;
          const label = element.getAttribute("data-clarity-label");
          if (label) trackClarityEvent(label);
        });

        document.addEventListener("focusin", (event) => {
          const target = event.target;
          if (!(target instanceof Element) || !target.matches("input[data-clarity-label], textarea[data-clarity-label], select[data-clarity-label]")) return;
          trackClarityEvent(target.getAttribute("data-clarity-label"));
        });

        document.addEventListener("submit", (event) => {
          const form = event.target;
          if (form instanceof HTMLFormElement) {
            trackClarityEvent(form.getAttribute("data-clarity-label"));
          }
        });
      }
    </script>
