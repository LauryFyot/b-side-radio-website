<!doctype html>
<html lang="fr">
  <head>
    <!-- Google tag (gtag.js) only un public and production website -->
    <script>
      (() => {
        const isPublicProduction =
          window.location.protocol === 'https:' &&
          ['b-side-radio.com', 'www.b-side-radio.com'].includes(window.location.hostname) &&
          !/^\/(?:admin|dev)(?:\/|$)/i.test(window.location.pathname);

        if (!isPublicProduction) return;

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', 'G-3SNWYSPZ5Z');

        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-3SNWYSPZ5Z';
        document.head.appendChild(script);

        document.addEventListener('click', (event) => {
          const target = event.target;
          if (!(target instanceof Element)) return;

          const playerButton = target.closest('button[data-clarity-label]');
          const playerLocations = {
            'player-toggle-hero': 'hero',
            'player-toggle-bar': 'player_bar',
            'mix-play': 'mix_sessions',
            'replay-play': 'replays',
          };
          const buttonLocation = playerLocations[playerButton?.getAttribute('data-clarity-label')];
          if (buttonLocation && !playerButton.disabled) {
            window.gtag('event', 'player_click', {
              button_location: buttonLocation,
              button_id: playerButton.id,
              player_action: playerButton.getAttribute('aria-pressed') === 'true' ? 'pause' : 'play',
            });
          }

          const link = target.closest('a[href]');
          if (link) {
            const url = new URL(link.href, window.location.href);
            if (url.hostname === 'traxsource.com' || url.hostname.endsWith('.traxsource.com')) {
              window.gtag('event', 'traxsource_click', {
                button_location: link.id === 'partner-traxsource-player'
                  ? 'player_bar' : link.closest('section[id]')?.id || 'other',
                link_type: link.id === 'partner-traxsource-player' || link.closest('li') ? 'purchase' : 'partnership',
                link_url: url.href,
              });
            }
          }

          if (target.closest('#equipe')) {
            window.gtag('event', 'team_click', {
              button_location: 'equipe',
              member_name: target.closest('[data-team-member]')?.getAttribute('data-team-member') || 'section',
            });
          }
        }, { capture: true });
      })();
    </script>
